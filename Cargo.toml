[package]
name = "cerberust"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "Fast Rust guardrails for LLM input/output — composable scanners (PII, secrets, prompt-injection) and streaming middleware."
license = "MIT OR Apache-2.0"
repository = "https://github.com/taostat/cerberust"
readme = "README.md"
keywords = ["llm", "guardrails", "pii", "security", "scanner"]
categories = ["text-processing"]
publish = true

# docs.rs builds with the `wasm` feature so `wasm::WasmScanner` is documented.
# `prompt-injection` is deliberately excluded: `ort`'s `download-binaries`
# fetches a prebuilt ONNX Runtime at build time, which fails in the
# network-sandboxed docs.rs builder. The `--cfg docsrs` flag lets the source
# gate doc-only attributes on it.
[package.metadata.docs.rs]
features = ["wasm"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = "2.0"
regex = "1.11"
# The streaming output runner feeds output bytes into a DFA to bound hold-back:
# from each byte the match is complete / still-live / dead, and only a region
# the DFA proves dead-from-start is safe to flush. The high-level `regex` crate
# only answers "matches?" over a whole string; `regex-automata` exposes the lazy
# DFA whose per-byte state is what bounds the hold-back conservatively. It is the
# same audited regex-crate ecosystem `regex` already depends on — the version is
# unified in Cargo.lock and `cargo deny` stays clean.
regex-automata = "0.4"
# The vendored gitleaks secret rules each carry keywords; a rule's regex runs
# only when one of its keywords occurs in the text (gitleaks' own prefilter).
# One case-insensitive Aho-Corasick pass over ~200 keywords picks the candidate
# rules instead of running every regex. `aho-corasick` is already in the tree as
# a `regex` dependency, so this adds no new crate.
aho-corasick = "1"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
hex = "0.4"

# Keyed-deterministic sentinel suffixes (the Vault's `NonceStrategy::Deterministic`
# mode): the suffix is `HMAC-SHA256(key, value)` truncated to hex. It must be a
# *keyed* MAC, never a bare hash — low-entropy PII (emails, phones, SSNs) is
# brute-forceable from an unkeyed hash. `hmac` + `sha2` are the RustCrypto
# reference implementations, share the `digest` 0.10 trait crate (versions unify
# in Cargo.lock, `cargo deny` stays clean), and `sha2` carries no system
# dependency.
hmac = "0.12"
sha2 = "0.10"

# The WASM guard runner (feature `wasm`). `wasmtime` is the reference
# WebAssembly Component Model runtime; it loads a user-submitted guard component
# and — instantiated against an import-less linker — runs it as a pure
# `scan(text) -> verdict` function with no ambient authority (no WASI, no
# network, no clock). This is the load-bearing sandbox for running untrusted
# third-party guards, so the runtime is the dependency that earns its weight.
# `default-features = false` drops the `wat`/`wast` text tooling and `winch`,
# keeping only the `cranelift` compiler and the `component-model` runtime.
# `anyhow` is wasmtime's own error type, surfaced only at load/trap boundaries
# and wrapped in `WasmLoadError`/`ScanError`.
# Pinned to the 36.x long-term-support line, which receives security fixes and
# requires rustc 1.86. This crate's `rust-version` (1.88) is set by `ort` and by
# current `encoding_rs` releases in the wasmtime tree.
wasmtime = { version = "36.0.16", default-features = false, features = [
    "runtime",
    "component-model",
    "cranelift",
], optional = true }
anyhow = { version = "1.0", optional = true }

# The ML PromptInjection scanner (feature `prompt-injection`). `ort` is the Rust
# binding to ONNX Runtime; `download-binaries` (an ort default feature) fetches a
# prebuilt ONNX Runtime at build time, so the crate compiles with no system ORT
# install. The `ndarray` feature is dropped — input tensors are built from
# `(shape, Vec<i64>)` and logits read back as an `&[f32]` slice, so the heavier
# ndarray dependency is not pulled. `tokenizers` is HuggingFace's own tokenizer
# crate, loading the model's `tokenizer.json` (a DeBERTa-v3 SentencePiece
# tokenizer); `onig` is its default regexer. Both are large trees, hence the
# off-by-default feature — the core scanner library never links them.
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "download-binaries",
    "tls-native",
], optional = true }
tokenizers = { version = "0.23", default-features = false, features = [
    "onig",
], optional = true }

[features]
# Off by default so the core scanner library stays lean (the wasmtime runtime is
# a large dependency tree). Turn on to load and run sandboxed WASM guards.
wasm = ["dep:wasmtime", "dep:anyhow"]
# Off by default so the core scanner library stays lean (the ort/ONNX Runtime and
# tokenizers trees are large). Turn on for the ML PromptInjection scanner.
prompt-injection = ["dep:ort", "dep:tokenizers"]

[dev-dependencies]
proptest = "1.6"
# Parses the vendored upstream `data/gitleaks/gitleaks.toml` in the rule
# generator test (tests/gitleaks_rules.rs), which renders and checks
# src/scanner/gitleaks_rules.rs. Test-only: the library links the generated
# Rust table, never a TOML parser.
toml = "1.0.7"

# The LLM Guard comparison bench. A custom `harness = false` bench: a
# plain `main()` that reads the shared corpus, runs each scanner, and writes the
# results JSON the Python side merges — `criterion` cannot read a corpus path,
# emit precision/recall, or feature-gate the ML scanner, so no bench framework is
# pulled in. The `prompt-injection` part is `#[cfg]`-gated on the same feature.
[[bench]]
name = "comparison"
harness = false

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Panic prevention
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
# No cheating
allow_attributes = "deny"
# Code hygiene
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Safety
exit = "deny"
mem_forget = "deny"
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"
